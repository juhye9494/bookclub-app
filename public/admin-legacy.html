<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 — 한경 석세스 클럽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4; --bg-card: #fff; --bg-warm: #f3ede2;
    --text: #1a1815; --text-mid: #4a463f; --text-muted: #8a8478;
    --border: #e5dfd2; --border-dark: #cfc8b8;
    --accent: #fc6640; --accent-dark: #d44d2a;
    --danger: #c0392b; --success: #2a8a5f;
    --serif: 'Noto Serif KR', serif; --sans: 'Noto Sans KR', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 0.9rem; }

  /* ===== Login screen ===== */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    width: 100%; max-width: 380px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 8px; padding: 40px 32px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }
  .login-logo { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; text-align: center; }
  .login-logo span { color: var(--accent); }
  .login-title { font-family: var(--serif); font-size: 1.4rem; font-weight: 700; margin-top: 18px; margin-bottom: 6px; text-align: center; }
  .login-sub { font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-bottom: 26px; }
  .login-form label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
  .login-form input {
    width: 100%; padding: 11px 14px; font: inherit; font-size: 0.92rem;
    border: 1px solid var(--border-dark); border-radius: 6px; background: var(--bg);
    margin-bottom: 6px;
  }
  .login-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 12px; margin-top: 14px;
    background: var(--text); color: #fff; border: none; border-radius: 6px;
    font: inherit; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .login-btn:hover { background: var(--accent); }
  .login-error { color: var(--danger); font-size: 0.78rem; margin-top: 8px; min-height: 1em; }
  .login-hint { margin-top: 20px; padding: 12px; background: var(--bg-warm); border-radius: 6px; font-size: 0.74rem; color: var(--text-muted); line-height: 1.5; }
  .login-hint code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; font-size: 0.95em; }

  /* ===== Admin shell ===== */
  .admin { display: none; }
  .admin.show { display: block; }
  .admin-nav {
    position: sticky; top: 0; z-index: 50; background: var(--text); color: #fff;
    padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
  }
  .admin-nav-logo { font-family: var(--serif); font-size: 1rem; font-weight: 700; }
  .admin-nav-logo span { color: var(--accent); }
  .admin-nav-label { font-size: 0.72rem; opacity: 0.55; margin-left: 12px; letter-spacing: 0.06em; }
  .admin-nav-actions { display: flex; gap: 14px; align-items: center; font-size: 0.82rem; }
  .admin-nav-actions a, .admin-nav-actions button {
    color: rgba(255,255,255,0.7); background: none; border: none; cursor: pointer; font: inherit;
  }
  .admin-nav-actions a:hover, .admin-nav-actions button:hover { color: #fff; }

  .admin-body { max-width: 1240px; margin: 0 auto; padding: 20px 32px 80px; }

  /* ===== Sidebar layout ===== */
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; }
  @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

  .sidebar {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 20px; height: fit-content; position: sticky; top: 80px;
  }
  .sidebar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sidebar-title { font-size: 0.78rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .sidebar-add {
    background: var(--accent); color: #fff; border: none; border-radius: 4px;
    width: 22px; height: 22px; cursor: pointer; font-size: 1rem; line-height: 1; font-weight: 600;
  }
  .sidebar-add:hover { background: var(--accent-dark); }
  .cycle-list { list-style: none; }
  .cycle-list li {
    padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    margin-bottom: 4px; border-left: 3px solid transparent; transition: all 0.15s;
  }
  .cycle-list li:hover { background: var(--bg-warm); }
  .cycle-list li.active { background: var(--bg-warm); border-left-color: var(--accent); font-weight: 600; }
  .cycle-list li .meta { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; font-weight: 400; }
  .cycle-status { display: inline-block; font-size: 0.62rem; padding: 1px 6px; border-radius: 8px; margin-left: 6px; vertical-align: middle; }
  .cycle-status.active { background: var(--accent); color: #fff; }
  .cycle-status.archived { background: var(--border-dark); color: var(--text); }
  .cycle-status.draft { background: #e0d4b8; color: var(--text-mid); }

  /* ===== Main content ===== */
  .main-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
    padding: 28px 32px;
  }
  .cycle-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border);
    gap: 16px; flex-wrap: wrap;
  }
  .cycle-header h2 { font-family: var(--serif); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .cycle-header .sub { color: var(--text-muted); font-size: 0.82rem; margin-top: 4px; }
  .cycle-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 8px 14px; font-size: 0.8rem; font-weight: 500; border-radius: 5px;
    border: 1px solid var(--border-dark); background: var(--bg-card); color: var(--text);
    cursor: pointer; transition: all 0.15s; font-family: inherit;
  }
  .btn:hover { border-color: var(--text); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  .btn.danger { color: var(--danger); border-color: #e8c4be; }
  .btn.danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 0.72rem; font-weight: 600; color: var(--text-mid); margin-bottom: 5px; letter-spacing: 0.02em; }
  .field input, .field select, .field textarea {
    padding: 9px 12px; font: inherit; font-size: 0.85rem;
    border: 1px solid var(--border-dark); border-radius: 5px; background: #fff;
    color: var(--text); font-family: inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  .field textarea { resize: vertical; min-height: 76px; line-height: 1.55; }

  /* ===== Books ===== */
  .books-section { margin-top: 28px; }
  .books-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .books-head h3 { font-family: var(--serif); font-size: 1.1rem; font-weight: 700; }
  .books-head h3 .count { color: var(--text-muted); font-weight: 400; margin-left: 8px; font-size: 0.85rem; }

  .book-row {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px;
    padding: 14px; align-items: center;
    background: var(--bg); border-radius: 6px; margin-bottom: 8px;
    border: 1px solid transparent; transition: all 0.15s;
  }
  .book-row:hover { border-color: var(--border); }
  .book-row.editing { border-color: var(--accent); background: #fff8f5; }
  .br-cover {
    width: 56px; height: 76px; background: var(--bg-warm); border-radius: 3px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    font-size: 0.62rem; color: var(--text-muted); text-align: center; padding: 4px; line-height: 1.2;
  }
  .br-cover img { width: 100%; height: 100%; object-fit: cover; }
  .br-info { min-width: 0; }
  .br-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .br-meta { font-size: 0.75rem; color: var(--text-muted); }
  .br-tags { display: inline-flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
  .br-tag { font-size: 0.65rem; background: var(--bg-warm); padding: 2px 7px; border-radius: 10px; color: var(--text-mid); }
  .br-tag.lecture { background: #fde7df; color: var(--accent-dark); font-weight: 600; }
  .br-actions { display: flex; gap: 6px; }
  .br-actions .btn { padding: 5px 10px; font-size: 0.72rem; }

  /* ===== Edit form ===== */
  .book-edit {
    background: #fff; border: 1px solid var(--accent); border-radius: 6px;
    padding: 20px; margin-bottom: 10px;
  }
  .edit-head { font-family: var(--serif); font-weight: 700; margin-bottom: 14px; font-size: 1rem; }
  .edit-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .lecture-block {
    margin-top: 14px; padding: 14px; background: var(--bg-warm); border-radius: 5px;
  }
  .lecture-block .lecture-title { font-size: 0.78rem; font-weight: 700; margin-bottom: 10px; color: var(--text-mid); }
  .perks-input { margin-top: 8px; }
  .perks-input .field label { margin-top: 0; }

  /* ===== Modal ===== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 8px; max-width: 480px; width: 100%;
    padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .modal h3 { font-family: var(--serif); font-size: 1.2rem; margin-bottom: 6px; }
  .modal p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: #fff; padding: 12px 22px; border-radius: 6px;
    font-size: 0.85rem; opacity: 0; transition: all 0.25s; pointer-events: none; z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .empty-state { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.85rem; }
</style>
</head>
<body>

<!-- ===== Login ===== -->
<div class="login-wrap" id="loginScreen">
  <div class="login-card">
    <p class="login-logo">한경 <span>석세스</span> 클럽</p>
    <h1 class="login-title">관리자 로그인</h1>
    <p class="login-sub">SE-관리자만 접근 가능합니다.</p>
    <form class="login-form" id="loginForm">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" autocomplete="current-password" required />
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="login-btn">로그인</button>
    </form>
    <div class="login-hint">
      데모 비밀번호: <code>se-admin</code><br />
      실 배포 시 백엔드 인증으로 교체 예정입니다.
    </div>
  </div>
</div>

<!-- ===== Admin app ===== -->
<div class="admin" id="adminApp">
  <nav class="admin-nav" style="display: none;">
    <div>
      <span class="admin-nav-logo">한경 <span>석세스</span> 클럽</span>
      <span class="admin-nav-label">ADMIN</span>
    </div>
    <div class="admin-nav-actions">
      <a href="/archive.html" target="_blank">아카이브 ↗</a>
      <a href="/" target="_blank">메인 사이트 ↗</a>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </nav>

  <div class="admin-body">
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="sidebar-title">시즌</span>
          <button class="sidebar-add" id="addCycleBtn" title="새 시즌 추가">+</button>
        </div>
        <ul class="cycle-list" id="cycleList"></ul>
      </aside>

      <section class="main-card" id="mainCard">
        <div class="empty-state">시즌을 선택하세요</div>
      </section>
    </div>
  </div>
</div>

<!-- ===== New cycle modal ===== -->
<div class="modal-bg" id="cycleModal">
  <div class="modal">
    <h3>새 시즌 만들기</h3>
    <p>6개월 단위 도서 큐레이션 시즌을 생성합니다.</p>
    <form id="cycleForm">
      <div class="field" style="margin-bottom:12px">
        <label>시즌 라벨</label>
        <input type="text" name="label" placeholder="예: 2026 하반기" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label>시작일</label>
          <input type="date" name="startDate" required />
        </div>
        <div class="field">
          <label>종료일</label>
          <input type="date" name="endDate" required />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="closeModal()">취소</button>
        <button type="submit" class="btn primary">생성하기</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="bookclub-data.js"></script>
<script>
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ===== Auth =====
  const loginScreen = document.getElementById('loginScreen');
  const adminApp = document.getElementById('adminApp');

  function showAdmin() {
    loginScreen.style.display = 'none';
    adminApp.classList.add('show');
    renderSidebar();
    const cycles = BookclubData.getAllCycles();
    if (cycles.length) selectCycle(cycles[0].id);
  }

  // Always show admin since authentication is handled by parent frame
  showAdmin();

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
  });
  document.getElementById('logoutBtn').addEventListener('click', () => {
  });

  // ===== Sidebar / Cycle list =====
  let activeCycleId = null;

  function renderSidebar() {
    const list = document.getElementById('cycleList');
    const cycles = BookclubData.getAllCycles();
    list.innerHTML = cycles.map(c => `
      <li data-id="${c.id}" class="${c.id === activeCycleId ? 'active' : ''}">
        ${escapeHtml(c.label)}
        <span class="cycle-status ${c.status}">${({active:'운영중',archived:'종료',draft:'준비중'})[c.status] || c.status}</span>
        <span class="meta">도서 ${c.books.length}권 · ${c.startDate} ~ ${c.endDate}</span>
      </li>
    `).join('');
    list.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', () => selectCycle(li.dataset.id));
    });
  }

  function selectCycle(id) {
    activeCycleId = id;
    renderSidebar();
    renderMain();
  }

  // ===== Main panel =====
  let editingBookId = null;
  let creatingBook = false;

  function renderMain() {
    const cycle = BookclubData.getCycleById(activeCycleId);
    const root = document.getElementById('mainCard');
    if (!cycle) { root.innerHTML = '<div class="empty-state">시즌을 선택하세요</div>'; return; }

    root.innerHTML = `
      <div class="cycle-header">
        <div>
          <h2>${escapeHtml(cycle.label)}</h2>
          <p class="sub">${escapeHtml(cycle.startDate)} ~ ${escapeHtml(cycle.endDate)} · 상태: <strong>${({active:'운영중',archived:'종료',draft:'준비중'})[cycle.status]}</strong></p>
        </div>
        <div class="cycle-actions">
          <select id="cycleStatus" class="btn" style="padding:7px 10px">
            <option value="draft" ${cycle.status==='draft'?'selected':''}>준비중</option>
            <option value="active" ${cycle.status==='active'?'selected':''}>운영중</option>
            <option value="archived" ${cycle.status==='archived'?'selected':''}>종료</option>
          </select>
          <button class="btn" id="editCycleBtn">시즌 정보 수정</button>
          <button class="btn danger" id="deleteCycleBtn">시즌 삭제</button>
        </div>
      </div>

      <div class="books-section">
        <div class="books-head">
          <h3>도서 목록 <span class="count">${cycle.books.length}권</span></h3>
          <button class="btn primary" id="addBookBtn">+ 도서 추가</button>
        </div>
        <div id="booksList"></div>
      </div>
    `;

    document.getElementById('cycleStatus').addEventListener('change', e => {
      BookclubData.updateCycle(cycle.id, { status: e.target.value });
      toast('상태가 변경되었습니다.');
      renderSidebar(); renderMain();
    });
    document.getElementById('editCycleBtn').addEventListener('click', () => editCycleInfo(cycle));
    document.getElementById('deleteCycleBtn').addEventListener('click', () => deleteCycle(cycle));
    document.getElementById('addBookBtn').addEventListener('click', () => {
      creatingBook = true; editingBookId = null; renderBooks();
    });
    renderBooks();
  }

  function renderBooks() {
    const cycle = BookclubData.getCycleById(activeCycleId);
    const list = document.getElementById('booksList');
    let html = '';
    if (creatingBook) {
      html += bookEditFormHtml(null);
    }
    if (!cycle.books.length && !creatingBook) {
      html += '<div class="empty-state">아직 등록된 도서가 없습니다. + 도서 추가를 눌러 시작하세요.</div>';
    } else {
      html += cycle.books.map(b => editingBookId === b.id ? bookEditFormHtml(b) : bookRowHtml(b)).join('');
    }
    list.innerHTML = html;

    list.querySelectorAll('[data-edit-book]').forEach(b => b.addEventListener('click', () => { editingBookId = b.dataset.editBook; creatingBook = false; renderBooks(); }));
    list.querySelectorAll('[data-delete-book]').forEach(b => b.addEventListener('click', () => deleteBook(b.dataset.deleteBook)));
    list.querySelectorAll('[data-save-book]').forEach(b => b.addEventListener('click', () => saveBook(b.dataset.saveBook)));
    list.querySelectorAll('[data-cancel-book]').forEach(b => b.addEventListener('click', () => { editingBookId = null; creatingBook = false; renderBooks(); }));
  }

  function bookRowHtml(b) {
    return `
      <div class="book-row">
        <div class="br-cover">${b.cover ? `<img src="${escapeHtml(b.cover)}" />` : escapeHtml(b.title.slice(0, 20))}</div>
        <div class="br-info">
          <div class="br-title">${escapeHtml(b.title)}</div>
          <div class="br-meta">${escapeHtml(b.author)} · ${escapeHtml(b.genre || '-')}</div>
          <div class="br-tags">
            ${(b.tags||[]).map(t => `<span class="br-tag">${escapeHtml(t)}</span>`).join('')}
            ${b.lecture ? '<span class="br-tag lecture">+ 저자 강연권</span>' : ''}
          </div>
        </div>
        <div class="br-actions">
          <button class="btn" data-edit-book="${b.id}">편집</button>
          <button class="btn danger" data-delete-book="${b.id}">삭제</button>
        </div>
      </div>
    `;
  }

  function bookEditFormHtml(b) {
    const id = b ? b.id : 'NEW';
    b = b || { title:'', author:'', genre:'', cover:'', tags:[], desc:'', lecture:null };
    const tags = (b.tags||[]).join(', ');
    return `
      <div class="book-edit">
        <p class="edit-head">${b.title ? '도서 편집' : '새 도서 추가'}</p>
        <div class="field-row">
          <div class="field"><label>제목 *</label><input id="f-title-${id}" value="${escapeHtml(b.title)}" required /></div>
          <div class="field"><label>저자 *</label><input id="f-author-${id}" value="${escapeHtml(b.author)}" required /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>장르</label><input id="f-genre-${id}" value="${escapeHtml(b.genre)}" placeholder="예: 경제 · 투자" /></div>
          <div class="field"><label>표지 이미지 경로</label><input id="f-cover-${id}" value="${escapeHtml(b.cover)}" placeholder="uploads/cover.jpg" /></div>
        </div>
        <div class="field" style="margin-bottom:14px">
          <label>태그 (쉼표로 구분)</label>
          <input id="f-tags-${id}" value="${escapeHtml(tags)}" placeholder="투자, 경제, 강연 포함" />
        </div>
        <div class="field" style="margin-bottom:14px">
          <label>설명</label>
          <textarea id="f-desc-${id}">${escapeHtml(b.desc)}</textarea>
        </div>
        <div class="lecture-block">
          <p class="lecture-title">
            <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:inherit">
              <input type="checkbox" id="f-hasLecture-${id}" ${b.lecture ? 'checked' : ''} onchange="document.getElementById('lecture-fields-${id}').style.display=this.checked?'block':'none'" />
              저자 강연권 포함
            </label>
          </p>
          <div id="lecture-fields-${id}" style="display:${b.lecture ? 'block' : 'none'}">
            <div class="field" style="margin-bottom:10px">
              <label>강연 설명</label>
              <textarea id="f-lectureDesc-${id}">${escapeHtml(b.lecture?.desc || '')}</textarea>
            </div>
            <div class="field">
              <label>혜택 (한 줄에 하나씩)</label>
              <textarea id="f-lecturePerks-${id}">${escapeHtml((b.lecture?.perks||[]).join('\n'))}</textarea>
            </div>
          </div>
        </div>
        <div class="edit-foot">
          <button class="btn" data-cancel-book="${id}">취소</button>
          <button class="btn primary" data-save-book="${id}">저장</button>
        </div>
      </div>
    `;
  }

  function readForm(id) {
    const has = document.getElementById(`f-hasLecture-${id}`).checked;
    return {
      title: document.getElementById(`f-title-${id}`).value.trim(),
      author: document.getElementById(`f-author-${id}`).value.trim(),
      genre: document.getElementById(`f-genre-${id}`).value.trim(),
      cover: document.getElementById(`f-cover-${id}`).value.trim(),
      tags: document.getElementById(`f-tags-${id}`).value.split(',').map(t => t.trim()).filter(Boolean),
      desc: document.getElementById(`f-desc-${id}`).value.trim(),
      lecture: has ? {
        desc: document.getElementById(`f-lectureDesc-${id}`).value.trim(),
        perks: document.getElementById(`f-lecturePerks-${id}`).value.split('\n').map(p => p.trim()).filter(Boolean)
      } : null
    };
  }

  function saveBook(id) {
    const data = readForm(id);
    if (!data.title || !data.author) { toast('제목과 저자는 필수입니다.'); return; }
    if (id === 'NEW') {
      BookclubData.addBook(activeCycleId, data);
      toast('도서가 추가되었습니다.');
    } else {
      BookclubData.updateBook(activeCycleId, id, data);
      toast('변경사항이 저장되었습니다.');
    }
    editingBookId = null; creatingBook = false;
    renderSidebar(); renderBooks();
  }

  function deleteBook(id) {
    if (!confirm('이 도서를 삭제하시겠습니까?')) return;
    BookclubData.deleteBook(activeCycleId, id);
    toast('삭제되었습니다.');
    renderSidebar(); renderBooks();
  }

  function editCycleInfo(cycle) {
    const newLabel = prompt('시즌 라벨', cycle.label);
    if (newLabel == null) return;
    const newStart = prompt('시작일 (YYYY-MM-DD)', cycle.startDate);
    if (newStart == null) return;
    const newEnd = prompt('종료일 (YYYY-MM-DD)', cycle.endDate);
    if (newEnd == null) return;
    BookclubData.updateCycle(cycle.id, { label: newLabel, startDate: newStart, endDate: newEnd });
    toast('시즌 정보가 수정되었습니다.');
    renderSidebar(); renderMain();
  }

  function deleteCycle(cycle) {
    if (!confirm(`'${cycle.label}' 시즌을 정말 삭제하시겠습니까? 모든 도서 정보가 함께 삭제됩니다.`)) return;
    BookclubData.deleteCycle(cycle.id);
    toast('삭제되었습니다.');
    const cycles = BookclubData.getAllCycles();
    activeCycleId = cycles[0]?.id || null;
    renderSidebar(); renderMain();
  }

  // ===== New cycle modal =====
  const cycleModal = document.getElementById('cycleModal');
  function closeModal() { cycleModal.classList.remove('show'); }
  window.closeModal = closeModal;
  document.getElementById('addCycleBtn').addEventListener('click', () => cycleModal.classList.add('show'));
  cycleModal.addEventListener('click', e => { if (e.target === cycleModal) closeModal(); });
  document.getElementById('cycleForm').addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const label = fd.get('label');
    const startDate = fd.get('startDate');
    const endDate = fd.get('endDate');
    const id = 'cycle-' + Date.now();
    BookclubData.createCycle({ id, label, startDate, endDate, status: 'draft', books: [] });
    e.target.reset(); closeModal();
    activeCycleId = id; renderSidebar(); renderMain();
    toast('새 시즌이 생성되었습니다.');
  });
</script>

</body>
</html>
